version: '3.9'
services:
  backend:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app
    volumes:
      - ./src/backend:/app
    command: bash -lc "dotnet run --project src/Api/Api.csproj --urls http://0.0.0.0:5070"
    ports:
      - "5070:5070"

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./src/frontend:/app
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5070
